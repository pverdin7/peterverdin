name = "peterverdin"
main = "worker/index.js"
compatibility_date = "2026-10-29"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[vars]
SITE_ORIGIN = "https://peterverdin.goldinthecracksofficial.workers.dev"
ADMIN_EMAIL = "goldinthecracksofficial@gmail.com"
REPLY_TO = "goldinthecracksofficial@gmail.com"
EMAIL_FROM = "Peter Verdin <DrPete@peterverdin.com>"
TURNSTILE_SITE_KEY = "0x4AAAAAAFrc2sQMmKPLyNkU"

[[d1_databases]]
binding = "DB"
database_name = "peter-verdin-access"
database_id = "db8121a2-f5ee-4e3a-b2b8-af2f2c44f63d"

[[r2_buckets]]
binding = "PRIVATE_ASSETS"
bucket_name = "peter-verdin-private"
